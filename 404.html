<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found | OneToBeam</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/webp" href="https://www.onetobeam.com/website/images/OneToBeam%20Logo.webp" />
<meta name="theme-color" content="#0a0a0a" />
<style>
/* =========================================================
   ROOT
========================================================= */
:root {
    --bg: #0a0a0a;
    --bg-soft: #101010;
    --surface: #151515;
    --surface-2: #1b1b1b;
    --text: #f5f5f2;
    --muted: #9b9b97;
    --line: rgba(255,255,255,0.10);
    --accent: #c6a55c;
    --accent-dark: #a88b48;
    --max-width: 1280px;
    --radius-lg: 28px;
    --radius-md: 18px;
    --radius-sm: 12px;
}

/* =========================================================
   RESET
========================================================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
    overflow-x: hidden;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

img {
    width: 100%;
    display: block;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

/* =========================================================
   GLOBAL
========================================================= */
.container {
    width: min(var(--max-width), calc(100% - 48px));
    margin: auto;
}

.section-label {
    color: var(--accent);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 2px;
    font-weight: 600;
    margin-bottom: 18px;
}

.section-title {
    font-size: clamp(38px, 5vw, 70px);
    line-height: 0.98;
    letter-spacing: -3px;
    font-weight: 500;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 14px 22px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    transition: 0.25s ease;
}

.btn-primary {
    background: var(--accent);
    color: #111;
}

.btn-primary:hover {
    background: white;
    transform: translateY(-2px);
}

.btn-outline {
    border: 1px solid rgba(255,255,255,0.25);
    color: white;
}

.btn-outline:hover {
    background: white;
    color: black;
}

/* =========================================================
   404 PAGE
========================================================= */
.error-page {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 120px 24px;
    position: relative;
}

.error-page::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(198,165,92,0.06), transparent 50%);
    pointer-events: none;
}

.error-content {
    text-align: center;
    max-width: 520px;
    position: relative;
    z-index: 1;
}

.error-code {
    font-size: clamp(120px, 20vw, 280px);
    font-weight: 700;
    line-height: 0.9;
    letter-spacing: -10px;
    color: var(--accent);
    margin-bottom: 16px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.error-title {
    font-size: clamp(28px, 4vw, 48px);
    font-weight: 500;
    letter-spacing: -1.5px;
    margin-bottom: 16px;
    color: var(--text);
}

.error-description {
    color: var(--muted);
    font-size: 17px;
    line-height: 1.7;
    margin-bottom: 32px;
    max-width: 420px;
    margin-left: auto;
    margin-right: auto;
}

.error-actions {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 48px;
}

.error-illustration {
    margin-top: 60px;
    opacity: 0.4;
}

.error-illustration svg {
    width: 100%;
    max-width: 380px;
    height: auto;
}

/* =========================================================
   FOOTER (minimal)
========================================================= */
.error-footer {
    padding: 32px 24px;
    border-top: 1px solid var(--line);
    text-align: center;
    color: #555;
    font-size: 12px;
}

/* =========================================================
   ANIMATIONS
========================================================= */
@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.7; }
}

.error-illustration {
    animation: float 4s ease-in-out infinite;
}

.error-code {
    animation: pulse 3s ease-in-out infinite;
}

/* =========================================================
   MOBILE
========================================================= */
@media (max-width: 500px) {
    .error-code {
        letter-spacing: -6px;
    }
    
    .error-actions {
        flex-direction: column;
        align-items: center;
    }
    
    .error-actions .btn {
        width: 100%;
        max-width: 280px;
    }
}
</style>
</head>
<body>

<!-- =========================================================
     404 ERROR PAGE
========================================================= -->
<main class="error-page">
    <div class="container">
        <div class="error-content">
            
            <div class="section-label">Error 404</div>
            
            <div class="error-code">404</div>
            
            <h1 class="error-title">Page Not Found</h1>
            
            <p class="error-description">
                The page you're looking for doesn't exist or has been moved. 
                Don't worry â€” let's get you back on track.
            </p>
            
            <div class="error-actions">
                <a href="." class="btn btn-primary">Back to Home</a>
                <a href="#contact" class="btn btn-outline">Contact Us</a>
            </div>
            
            <div class="error-illustration">
                <svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Building outline -->
                    <rect x="80" y="180" width="240" height="100" rx="4" stroke="currentColor" stroke-width="2"/>
                    <!-- Windows -->
                    <g stroke="currentColor" stroke-width="1.5">
                        <rect x="100" y="200" width="24" height="30" rx="2"/>
                        <rect x="140" y="200" width="24" height="30" rx="2"/>
                        <rect x="180" y="200" width="24" height="30" rx="2"/>
                        <rect x="220" y="200" width="24" height="30" rx="2"/>
                        <rect x="260" y="200" width="24" height="30" rx="2"/>
                        <rect x="100" y="240" width="24" height="30" rx="2"/>
                        <rect x="140" y="240" width="24" height="30" rx="2"/>
                        <rect x="180" y="240" width="24" height="30" rx="2"/>
                        <rect x="220" y="240" width="24" height="30" rx="2"/>
                        <rect x="260" y="240" width="24" height="30" rx="2"/>
                    </g>
                    <!-- Door -->
                    <rect x="188" y="250" width="24" height="30" rx="2" fill="currentColor" opacity="0.3"/>
                    <!-- Roof elements -->
                    <rect x="150" y="160" width="100" height="4" rx="2" fill="currentColor" opacity="0.2"/>
                    <!-- Floating particles -->
                    <circle cx="50" cy="80" r="3" fill="currentColor" opacity="0.3">
                        <animate attributeName="cy" values="80;60;80" dur="3s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="350" cy="100" r="2" fill="currentColor" opacity="0.2">
                        <animate attributeName="cy" values="100;80;100" dur="4s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="380" cy="200" r="2.5" fill="currentColor" opacity="0.25">
                        <animate attributeName="cx" values="380;360;380" dur="3.5s" repeatCount="indefinite"/>
                    </circle>
                    <circle cx="30" cy="220" r="2" fill="currentColor" opacity="0.2">
                        <animate attributeName="cy" values="220;200;220" dur="2.5s" repeatCount="indefinite"/>
                    </circle>
                </svg>
            </div>
            
        </div>
    </div>
</main>

<footer class="error-footer">
    <div class="container">
        <p>Â© 2026 OneToBeam. All rights reserved.</p>
        <p style="margin-top: 8px;">Real Estate Visualization & Technology</p>
    </div>
</footer>

</body>
</html>
